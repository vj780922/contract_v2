<div class="section-title">第四條：健康狀況評估與風險聲明</div>
  <p><strong>健康狀況評估：</strong>甲方應於簽約前誠實告知乙方其個人健康狀況。請勾選以下符合甲方之情況：</p>
  
  <div class="health-checklist">
    <label class="check-item"><input type="checkbox" name="health" value="cvd"> 1. 心血管疾病 / 高血壓 / 胸悶胸痛歷史</label><br>
    <label class="check-item"><input type="checkbox" name="health" value="joint"> 2. 骨骼、關節舊傷或脊椎相關問題（如椎間盤突出、習慣性脫臼等）</label><br>
    <label class="check-item"><input type="checkbox" name="health" value="surgery"> 3. 近期接受過手術或尚在恢復期</label><br>
    <label class="check-item"><input type="checkbox" name="health" value="pregnant"> 4. 懷孕中或產後復健期</label><br>
    <label class="check-item"><input type="checkbox" name="health" value="chronic"> 5. 其他慢性疾病（如糖尿病、氣喘、癲癇等）</label><br>
    <label class="check-item"><input type="checkbox" name="health" value="none"> 6. 無上述狀況，身體健康適合進行體能訓練</label>
  </div>

  <p style="margin-top: 10px;">
    <strong>健康狀況詳細說明/備註：</strong>（若有勾選 1~5 項，請簡述狀況或醫師醫囑）<br>
    <input type="text" class="input-long" style="width: 100%;" id="health_notes" placeholder="無則填寫『無』">
  </p>

  <p>
    <strong>【風險聲明與確認】</strong><br>
    <label class="check-item">
      <input type="checkbox" id="risk_acknowledge" value="agreed">
      <strong>甲方已充分瞭解：</strong>體能訓練具有一定強度與風險，乙方將依專業進行評估並確保訓練安全。若甲方有特殊醫療狀況，應先尋求專業醫師評估並提供診斷證明。訓練期間若感到任何不適、疼痛或頭暈，甲方應立即主動告知乙方並停止訓練，切勿勉強。
    </label>
  </p>
